server:
  port: ${PORT:8080}
spring:
  application:
    name: medical-marketplace-backend

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: jdbc:postgresql://${DB_SERVER}:${DB_PORT}/${DB_NAME}?sslmode=require&socketTimeout=10&connectTimeout=10&prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${AUTH0_DOMAIN}/
          jwk-set-uri: https://${AUTH0_DOMAIN}/.well-known/jwks.json

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration/public
    baseline-on-migrate: true
    validate-on-migrate: true
    schemas: public

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

app:

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    frontend-url: ${FRONTEND_URL:http://localhost:5175}
    currency: ${STRIPE_CURRENCY:pen}

  tenant:
    migration-location: classpath:db/migration/tenant

  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:3600}

  auth0:
    management:
      domain: ${AUTH0_MANAGEMENT_DOMAIN}
      client-id: ${AUTH0_MANAGEMENT_CLIENT_ID}
      client-secret: ${AUTH0_MANAGEMENT_CLIENT_SECRET}
      audience: ${AUTH0_MANAGEMENT_AUDIENCE}
      connection: ${AUTH0_MANAGEMENT_CONNECTION:Username-Password-Authentication}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
